<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>汽水音乐 · 链接解析下载</title>
<style>
  :root{
    --bg:#0b0b0d; --card:#141417; --line:#26262c; --fg:#f2f2f4;
    --dim:#8d8d97; --accent:#3ee07f; --accent2:#1db954;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100vh;background:
      radial-gradient(900px 500px at 50% -10%,rgba(62,224,127,.13),transparent 70%),
      var(--bg);
    color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",
      "PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:28px 16px 48px;
  }
  .wrap{width:100%;max-width:560px}
  h1{font-size:19px;font-weight:650;letter-spacing:.3px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:22px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  textarea{
    width:100%;min-height:92px;resize:vertical;background:#0e0e11;color:var(--fg);
    border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;
    outline:none;transition:border-color .15s;
  }
  textarea:focus{border-color:var(--accent2)}
  .row{display:flex;gap:10px;margin-top:11px}
  button{
    font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 18px;
    cursor:pointer;transition:opacity .15s,transform .05s;
  }
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.5;cursor:default}
  .primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#04180c;flex:1}
  .ghost{background:#1c1c21;color:var(--fg);border:1px solid var(--line)}
  .hint{color:var(--dim);font-size:12px;margin-top:10px;min-height:16px}
  .card{
    margin-top:18px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:16px;display:none;
  }
  .card.on{display:block !important}
  .top{display:flex;gap:13px}
  .cov{width:88px;height:88px;border-radius:10px;object-fit:cover;background:#1c1c21;flex:none}
  .meta{min-width:0;flex:1}
  .t{font-size:15.5px;font-weight:650;line-height:1.38;word-break:break-word}
  .a{color:var(--dim);font-size:13px;margin-top:3px;word-break:break-word}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .tag{
    font-size:11.5px;color:#b9b9c2;background:#1c1c21;border:1px solid var(--line);
    border-radius:999px;padding:3px 9px;
  }
  .tag.ok{color:var(--accent);border-color:rgba(62,224,127,.35);background:rgba(62,224,127,.08)}
  .tag.ll{color:#7ad9ff;border-color:rgba(122,217,255,.3);background:rgba(122,217,255,.07)}
  .actions{display:flex;gap:10px;margin-top:15px}
  .actions a{
    flex:1;text-align:center;text-decoration:none;font-weight:600;font-size:14px;
    padding:12px;border-radius:10px;
    background:linear-gradient(180deg,var(--accent),var(--accent2));color:#04180c;
  }
  .actions .cp{
    flex:none;background:#1c1c21;color:var(--fg);border:1px solid var(--line);
  }
  details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  summary{color:var(--dim);font-size:12.5px;cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"› ";display:inline-block;transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  pre{
    white-space:pre-wrap;word-break:break-all;color:#9d9daa;font-size:11.5px;
    background:#0e0e11;border:1px solid var(--line);border-radius:8px;
    padding:10px;margin:9px 0 0;max-height:210px;overflow:auto;
  }
  .err{color:#ff7b7b}
</style>
</head>
<body>
<div class="wrap">
  <h1>汽水音乐 · 链接解析下载</h1>
  <div class="sub">粘贴分享链接，解析出音频直链，跨设备可用</div>

  <div class="box">
    <textarea id="in" placeholder="在这里粘贴，例如：
《歌名》@汽水音乐 https://qishui.douyin.com/s/xxxxxx/
或 https://music.douyin.com/qishui/share/track?track_id=..."></textarea>
    <div class="row">
      <button class="primary" id="go">解析</button>
      <button class="ghost" id="paste">粘贴</button>
      <button class="ghost" id="clear">清空</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="card" id="card">
    <div class="top">
      <img class="cov" id="cov" alt="">
      <div class="meta">
        <div class="t" id="title"></div>
        <div class="a" id="artist"></div>
        <div class="tags" id="tags"></div>
      </div>
    </div>
    <div class="actions">
      <a id="dl" href="#" download>下载音频</a>
      <button id="dlflac" class="ghost" style="flex:1;background:linear-gradient(180deg,#7ad9ff,#2b9fe0);color:#04202b">无损 FLAC</button>
      <button class="cp ghost" id="copy">复制直链</button>
    </div>
    <details>
      <summary>详情</summary>
      <pre id="raw"></pre>
    </details>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const hint = (t, isErr) => { const h = $("#hint"); h.textContent = t || ""; h.className = "hint" + (isErr ? " err" : ""); };
let last = null;

$("#paste").onclick = async () => {
  try {
    const t = await navigator.clipboard.readText();
    if (t) { $("#in").value = t.trim(); hint("已粘贴"); }
    else hint("剪贴板是空的", true);
  } catch (e) { hint("浏览器不给读剪贴板，手动粘贴吧", true); }
};
$("#clear").onclick = () => { $("#in").value = ""; hint(""); $("#card").classList.remove("on"); };

async function doParse() {
  const url = $("#in").value.trim();
  if (!url) return hint("先粘贴链接", true);
  $("#go").disabled = true;
  $("#card").classList.remove("on");
  hint("解析中…");
  try {
    const r = await fetch("api/parse", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || ("HTTP " + r.status));
    last = d;
    $("#cov").src = d.cover || "";
    $("#title").textContent = d.title || "(无标题)";
    $("#artist").textContent = [d.artist, d.album].filter(Boolean).join(" · ");
    const dur = d.duration ? Math.floor(d.duration / 60) + ":" + String(Math.round(d.duration % 60)).padStart(2, "0") : "";
    $("#tags").innerHTML = [
      d.quality ? `<span class="tag ok">${d.quality}</span>` : "",
      dur ? `<span class="tag">${dur}</span>` : "",
      d.encrypted ? `<span class="tag">加密</span>` : `<span class="tag">未加密</span>`,
      (d.lossless && d.lossless.available) ? `<span class="tag ok">无损已在本机</span>` : `<span class="tag ll">无损：点按钮自动补抓</span>`,
      d.vid ? `<span class="tag">vid ${d.vid.slice(0, 10)}…</span>` : ""
    ].join("");
    $("#dl").href = d.download;
    $("#dl").setAttribute("download", (d.filename || "audio") + ".m4a");
    const lf = $("#dlflac");
    lf.disabled = false;
    if (d.lossless && d.lossless.available) {
      lf.textContent = "无损 FLAC " + (d.lossless.size ? (d.lossless.size / 1048576).toFixed(1) + "MB" : "");
    } else {
      lf.textContent = "无损 FLAC";
    }
    $("#raw").textContent = JSON.stringify(d, null, 1);
    $("#card").classList.add("on");
    hint("解析成功");
  } catch (e) {
    hint("失败：" + e.message, true);
  } finally {
    $("#go").disabled = false;
  }
}
$("#go").onclick = doParse;

let busyFlac = false;
$("#dlflac").onclick = async () => {
  if (!last || busyFlac) return;
  const lf = $("#dlflac");
  busyFlac = true; lf.disabled = true;
  const had = last.lossless && last.lossless.available;
  const t0 = Date.now();
  const tick = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    hint(had ? ("正在生成无损… " + s + "s")
             : ("本机还没这首歌，正在唤起 App 播放它来取无损… " + s + "s（最长 75 秒）"));
  }, 500);
  try {
    const r = await fetch(last.lossless.download);
    if (!r.ok) {
      let m = "HTTP " + r.status;
      try { const j = await r.json(); m = j.error || m; } catch (e) {}
      throw new Error(m);
    }
    const b = await r.blob();
    if (b.size < 1024) throw new Error("返回内容不对");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = (last.filename || "audio") + ".flac";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    last.lossless.available = true;
    lf.textContent = "无损 " + (b.size / 1048576).toFixed(1) + "MB";
    const t = document.querySelector(".tag.ll");
    if (t) { t.textContent = "无损已在本机"; t.className = "tag ok"; }
    hint("无损已开始下载（" + (b.size / 1048576).toFixed(1) + "MB）");
  } catch (e) {
    hint("无损失败：" + e.message, true);
  } finally {
    clearInterval(tick);
    busyFlac = false; lf.disabled = false;
  }
};
$("#in").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") doParse();
});
$("#copy").onclick = async () => {
  if (!last) return;
  const abs = new URL(last.audio_url, location.href).href;
  try { await navigator.clipboard.writeText(abs); hint("直链已复制"); }
  catch { hint("复制失败，展开详情手动复制", true); }
};
</script>
</body>
</html>
